name: Release

# Builds the application on every supported platform, validates the version,
# signs release artifacts, generates SHA256 checksums, generates and merges the
# Tauri updater manifest (`latest.json`), creates a *draft* GitHub Release,
# validates it, and only then publishes it. A build that fails any validation
# gate can never produce a live, published release.
#
# Trigger: push a version tag, e.g.  v1.1.0
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
# Or run manually (Actions tab -> "Release" -> Run workflow):
#   version:  the version to release as MAJOR.MINOR.PATCH (no leading "v").
#             It must exactly match the application version; the pipeline
#             fails otherwise (no silent version correction, ever).
#   draft:    start as "true" (recommended) to leave the release unpublished
#             for inspection; set to "false" to publish automatically after
#             all validation passes.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          base64 minisign private key (updater signing)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD password for the updater signing key
#   WINDOWS_CERTIFICATE                REQUIRED (for Windows production releases):
#                                      base64 PFX of the CA-issued Authenticode
#                                      code-signing certificate (see RELEASE.md §7).
#                                      The build FAILS on Windows if it is unset.
#   WINDOWS_CERTIFICATE_PASSWORD       password for the Windows PFX
#   APPLE_CERTIFICATE                  (optional) base64 .p12 Apple Developer ID
#                                      Application certificate (macOS signing)
#   APPLE_CERTIFICATE_PASSWORD         (optional) .p12 password
#   APPLE_SIGNING_IDENTITY             (optional) cert name, e.g. "Developer ID Application: Aung Pwint (TEAMID)"
#   APPLE_ID                           (optional) Apple ID for notarization
#   APPLE_PASSWORD                     (optional) app-specific password for notarization
#   APPLE_TEAM_ID                      (optional) Apple Developer Team ID
#
# Environment variables (must match the release):
#   GITHUB_REPOSITORY_OWNER / GITHUB_REPOSITORY  used to build download URLs and
#                                                release notes. Defaults are
#                                                derived from the GitHub context.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release as MAJOR.MINOR.PATCH (no leading "v"), e.g. 1.1.0.
          Must match the application version across package.json, Cargo.toml
          and tauri.conf.json, or the run fails before building.
        required: true
      draft:
        description: >-
          Keep the GitHub Release as an unpublished draft after the build and
          stop. Set to "false" to publish it automatically once all validation
          passes.
        type: boolean
        default: true

permissions:
  contents: write

env:
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}
  # The tag the release is published under: on tag pushes it is the pushed tag
  # itself; on manual dispatch it is derived from the validated version input.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # ---------------------------------------------------------------------------
  # Version validation — fail fast if the release version does not match the app
  # version or if the three version locations disagree.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate manual release version format
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version input '$VERSION'. Use MAJOR.MINOR.PATCH (e.g. 1.1.0)." >&2
            exit 1
          fi
          echo "Manual release version input OK: $VERSION"
      - name: Validate versions & tag
        run: node scripts/check-versions.mjs --tag "$RELEASE_TAG"

  # ---------------------------------------------------------------------------
  # Build + test + generate updater artifacts on every platform.
  # ---------------------------------------------------------------------------
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            runner-os: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            runner-os: macos
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runner-os: linux

    runs-on: ${{ matrix.platform }}

    env:
      APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Install Tauri CLI
        run: pnpm add -D @tauri-apps/cli

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          pw="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          if [ -z "$key" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty — run 'gh auth login' then scripts/set-ci-secrets.ps1, and re-trigger the release." >&2
            exit 1
          fi
          if [ -z "$pw" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty — run scripts/set-ci-secrets.ps1." >&2
            exit 1
          fi
          dec="$(printf '%s' "$key" | base64 -d 2>/dev/null || true)"
          case "$dec" in
            "untrusted comment:"*) ;;
            *)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a valid base64 rsign/minisign key (decoded text must start with 'untrusted comment:'). Re-run scripts/set-ci-secrets.ps1." >&2
              exit 1
              ;;
          esac
          echo "updater signing key secret: OK (length ${#key}); password secret: OK (non-empty)"

      # ------------------------------------------------------------------
      # Windows Authenticode signing is REQUIRED for Windows production
      # legs: if the certificate secret is missing the run fails right here
      # instead of shipping an installer that Windows flags as unknown
      # publisher.
      # Signing itself happens inside `pnpm tauri build` via
      # `bundle.windows.signCommand` (scripts/windows-signing.ps1) so the
      # updater `.sig` files are computed over the *final, signed* installers.
      # ------------------------------------------------------------------
      - name: Validate Windows signing configuration (required)
        if: matrix.runner-os == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $missing += "WINDOWS_CERTIFICATE (base64 PFX of your CA-issued code-signing certificate)"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $missing += "WINDOWS_CERTIFICATE_PASSWORD"
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Windows production legs require Authenticode signing, but these repository secrets are missing: $($missing -join ', '). Add them with: gh secret set WINDOWS_CERTIFICATE --repo ${{ env.GITHUB_OWNER }}/${{ env.GITHUB_REPO }} (see RELEASE.md section 7). Refusing to build an unsigned Windows installer."
            exit 1
          }
          try {
            $bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            if ($bytes.Length -lt 4 -or ($bytes[0] -ne 0x30)) {
              Write-Host '::error::WINDOWS_CERTIFICATE does not decode to a PKCS#12 (.pfx) container (expects DER SEQUENCE 0x30). Re-export your certificate as a PFX and base64-encode it (see RELEASE.md section 7).'
              exit 1
            }
          } catch {
            Write-Host '::error::WINDOWS_CERTIFICATE is not valid base64. Re-encode your .pfx: base64 -w0 cert.pfx (see RELEASE.md section 7).'
            exit 1
          }
          Write-Host "Windows signing configuration OK - Authenticode signing is enabled for this release."

      # ------------------------------------------------------------------
      # macOS Developer ID signing + notarization (production only). The
      # signing certificate and Apple account are injected via CI secrets;
      # when they are absent the build is produced unsigned (clearly
      # distinct from signed production releases). tauri-bundler performs
      # the actual signing + notarization during `pnpm tauri build` using
      # the APPLE_* environment variables below.
      # ------------------------------------------------------------------
      - name: Import Apple certificate (macOS)
        if: matrix.runner-os == 'macos' && env.APPLE_CERT != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build & sign release bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # macOS Developer ID signing + notarization is production-only and
          # driven entirely by the APPLE_* secrets. Export them ONLY when the
          # certificate is actually configured: tauri-bundler attempts to
          # codesign whenever APPLE_SIGNING_IDENTITY is present (even as an
          # empty string), so an unset secret must leave the variable absent to
          # produce a clean unsigned build.
          if [ "${{ matrix.runner-os }}" = "macos" ] && [ -n "${APPLE_CERT:-}" ]; then
            export APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            echo "::notice::macOS signing + notarization enabled (APPLE_* secrets present)"
          fi
          # On Windows, tauri-bundler Authenticode-signs the app exe, the NSIS
          # installer and the MSI inside this build via
          # bundle.windows.signCommand (scripts/windows-signing.ps1). The
          # WINDOWS_* env vars above are read by that script; they are ignored
          # on macOS/Linux. The updater .sig is produced AFTER signing, over the
          # final signed artifacts.
          pnpm tauri build --target ${{ matrix.target }}

      # ------------------------------------------------------------------
      # Verify the Authenticode signatures of the exact artifacts that will
      # be uploaded. Each must show Status: Valid, a trusted chain, an
      # embedded publisher identity, a SHA-256 digest and an RFC 3161
      # timestamp. This step FAILS the run if any artifact is unsigned or
      # invalid - an unsigned installer can never be released.
      #
      # Note: tauri restores an UNSIGNED copy at release/onetype.exe after
      # bundling; the signed application executable ships inside the NSIS
      # installer payload. So we extract `onetype.exe` from the installer
      # with 7-Zip and verify THAT - it is the exact binary users will run.
      # ------------------------------------------------------------------
      - name: Verify Windows Authenticode signatures
        if: matrix.runner-os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = '${{ matrix.target }}'
          $root = "src-tauri/target/$target/release"

          $nsis = @(Get-ChildItem -Path "$root/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue)
          $msi  = @(Get-ChildItem -Path "$root/bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          if (-not $nsis) { Write-Host '::error::NSIS installer not found after tauri build.'; exit 1 }
          if (-not $msi)  { Write-Host '::error::MSI not found after tauri build.'; exit 1 }
          $installer = $nsis[0].FullName

          $sevenZip = @('C:\Program Files\7-Zip\7z.exe', 'C:\Program Files (x86)\7-Zip\7z.exe') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($cmd) { $sevenZip = $cmd.Source }
          }
          if (-not $sevenZip) {
            Write-Host '::error::7-Zip (7z.exe) not found - cannot extract the signed application exe from the NSIS installer for verification (see RELEASE.md section 7).'
            exit 1
          }
          $staging = Join-Path $env:TEMP ("onetype-verify-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $staging | Out-Null
          & $sevenZip x -y -o"$staging" $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::7-Zip failed to extract $installer."; exit 1 }
          $appExe = @(Get-ChildItem -Path $staging -Recurse -Filter 'onetype.exe' -ErrorAction SilentlyContinue) |
            Select-Object -First 1
          if (-not $appExe) {
            Write-Host '::error::Could not locate onetype.exe inside the NSIS installer payload - cannot verify the shipped application executable.'
            exit 1
          }

          $files = @($appExe.FullName, $installer) + @($msi[0].FullName)
          foreach ($file in $files) {
            & scripts/windows-signing.ps1 -Action Verify -File $file
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Windows Authenticode verification FAILED for $file - the artifact will not be released."
              exit $LASTEXITCODE
            }
          }
          Write-Host "All Windows artifacts (application exe, NSIS installer, MSI) carry valid, trusted, SHA-256, RFC 3161 timestamped Authenticode signatures."
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onetype-${{ matrix.runner-os }}-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

      - name: Verify updater pubkey matches signing key
        if: matrix.runner-os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          SIG_FILE=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.sig" | head -n1)
          [ -n "$SIG_FILE" ] || { echo "No updater .sig produced — is TAURI_SIGNING_PRIVATE_KEY set?" >&2; exit 1; }
          node .github/scripts/verify-updater-pubkey.mjs --sig "$SIG_FILE"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/releases

      - name: Gather updater assets into a flat staging dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/updates
          find dist/releases -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.sig" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.rpm" \) -exec cp -n {} dist/updates/ \;
          ls -la dist/updates

      - name: Build latest.json partials (Windows NSIS)
        shell: bash
        run: |
          set -euo pipefail
          WIN_EXE=$(ls dist/updates/*-setup.exe 2>/dev/null | head -n1 || true)
          if [ -z "$WIN_EXE" ]; then
            echo "No Windows NSIS updater payload found; skipping."
            exit 0
          fi
          WIN_SIG=$(ls dist/updates/*-setup.exe.sig 2>/dev/null | head -n1 || true)
          [ -f "$WIN_SIG" ] || { echo "Missing Windows installer signature (.sig)" >&2; exit 1; }
          TAG="$RELEASE_TAG"
          BASE="https://github.com/${{ env.GITHUB_OWNER }}/${{ env.GITHUB_REPO }}/releases/download/$TAG"
          node scripts/generate-latest-json.mjs --partial \
            --target windows-x86_64 \
            --url "$BASE/$(basename "$WIN_EXE")" \
            --sig-file "$WIN_SIG" \
            --out dist/updates/partial-windows-x86_64.json

      - name: Build latest.json partials (macOS ARM64)
        shell: bash
        run: |
          set -euo pipefail
          MAC_TGZ=$(ls dist/updates/*.app.tar.gz 2>/dev/null | head -n1 || true)
          if [ -z "$MAC_TGZ" ]; then
            echo "No macOS aarch64 updater payload found; skipping."
            exit 0
          fi
          MAC_SIG=$(ls dist/updates/*.app.tar.gz.sig 2>/dev/null | head -n1 || true)
          [ -f "$MAC_SIG" ] || { echo "Missing macOS updater signature (.sig)" >&2; exit 1; }
          TAG="$RELEASE_TAG"
          BASE="https://github.com/${{ env.GITHUB_OWNER }}/${{ env.GITHUB_REPO }}/releases/download/$TAG"
          node scripts/generate-latest-json.mjs --partial \
            --target darwin-aarch64 \
            --url "$BASE/$(basename "$MAC_TGZ")" \
            --sig-file "$MAC_SIG" \
            --out dist/updates/partial-darwin-aarch64.json

      - name: Build latest.json partials (Linux AppImage)
        shell: bash
        run: |
          set -euo pipefail
          LIN_APP=$(ls dist/updates/*.AppImage 2>/dev/null | head -n1 || true)
          if [ -z "$LIN_APP" ]; then
            echo "No Linux AppImage updater payload found; skipping."
            exit 0
          fi
          LIN_SIG=$(ls dist/updates/*.AppImage.sig 2>/dev/null | head -n1 || true)
          [ -f "$LIN_SIG" ] || { echo "Missing Linux updater signature (.sig)" >&2; exit 1; }
          TAG="$RELEASE_TAG"
          BASE="https://github.com/${{ env.GITHUB_OWNER }}/${{ env.GITHUB_REPO }}/releases/download/$TAG"
          node scripts/generate-latest-json.mjs --partial \
            --target linux-x86_64 \
            --url "$BASE/$(basename "$LIN_APP")" \
            --sig-file "$LIN_SIG" \
            --out dist/updates/partial-linux-x86_64.json

      - name: Merge latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          PARTIALS=$(find dist/updates -maxdepth 1 -type f -name 'partial-*.json' -print | tr '\n' ' ')
          if [ -z "$PARTIALS" ]; then
            echo "No updater partials found — nothing to publish." >&2
            exit 1
          fi
          node scripts/generate-latest-json.mjs --merge \
            --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes "See https://github.com/${{ env.GITHUB_OWNER }}/${{ env.GITHUB_REPO }}/releases/tag/$RELEASE_TAG" \
            --partials "$PARTIALS" \
            --out dist/updates/latest.json
          echo "=== merged latest.json ==="
          cat dist/updates/latest.json

      - name: Generate SHA256 checksums
        shell: bash
        run: node scripts/generate-checksums.mjs --dir dist/updates

      - name: Validate release artifacts, checksums & manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          node scripts/validate-release.mjs \
            --dir dist/updates \
            --version "$VERSION" \
            --tag "$TAG" \
            --latest-json dist/updates/latest.json

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --owner "${{ env.GITHUB_OWNER }}" \
            --repo "${{ env.GITHUB_REPO }}" \
            --assets-dir dist/updates \
            --checksums dist/updates/checksums.txt \
            --out dist/release-notes.md

      - name: Create GitHub Release (draft) & upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          # latest.json + checksums.txt + all downloaded platform bundles
          # (partial manifests are never uploaded as release assets).
          ASSETS="dist/updates/latest.json dist/updates/checksums.txt"
          for f in dist/updates/*; do
            case "$(basename "$f")" in
              partial-*.json | latest.json | checksums.txt) continue ;;
            esac
            if [ -f "$f" ]; then ASSETS="$ASSETS $f"; fi
          done
          # Create the draft if it does not exist yet; otherwise refresh it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading missing assets."
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md --draft=true
          else
            gh release create "$TAG" \
              --title "OneType $TAG" \
              --notes-file dist/release-notes.md \
              --draft \
              $ASSETS
          fi
          echo "--- Draft release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort

      - name: Publish draft release (safety gate passed)
        # Manual runs default to draft=true: leave the release unpublished for
        # human review. Re-run with draft=false (or the tag push) to publish.
        if: github.event_name != 'workflow_dispatch' || inputs.draft == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          # Never flip a draft to "published" unless assets are actually attached.
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "attached assets: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No assets attached to draft release $TAG — aborting publish." >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          echo "Published $TAG."

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
          echo "--- latest.json served at:"
          echo "https://github.com/${{ env.GITHUB_OWNER }}/${{ env.GITHUB_REPO }}/releases/latest/download/latest.json"
