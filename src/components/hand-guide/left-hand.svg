  <!-- Active-finger highlight strokes (neutral rest posture). Each finger is
       wrapped in its own .hand-finger group (id + data-hand + data-finger) so
       finger-motion.ts can animate it independently: a small, clamped bend
       around its base pivot plus a short axial reach toward the pressed key,
       driven by the finger group's SVG transform attribute. The highlight
       path inside signals the responsible finger via CSS (see App.css). -->
  <g class="hand-highlights">
