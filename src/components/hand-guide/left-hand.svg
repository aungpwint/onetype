<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 136 185 250" aria-hidden="true" focusable="false">
  <!--
    Left hand artwork derived as the exact horizontal mirror of right-hand.svg
    (about the x = 305 axis, i.e. x' = 610 - x), so both hands share the same
    design language: identical proportions, stroke width, curve treatment,
    nail rendering and coordinate scale. Active-finger feedback is applied as
    a highlight stroke (hand-highlight) toggled via CSS using the ancestor's
    data-active-finger attribute; each finger highlight carries data-finger.
  -->
  <style>
    .st1 {
      fill: color-mix(in srgb, var(--hand) 40%, transparent);
    }
    .st2 {
      fill: none;
      stroke: var(--hand-stroke);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-miterlimit: 10;
    }
    .st4 {
      fill: var(--hand-nail);
      opacity: 0.75;
    }
    .hand-highlight {
      fill: var(--hand-active);
      fill-opacity: 0.15;
      stroke: var(--hand-active);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-miterlimit: 10;
    }
    #hand {
      filter: drop-shadow(0 3px 5px rgb(0 0 0 / 0.16));
    }
  </style>
