<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%233B82F6'/%3E%3Cpath d='M22 9.6c0-1.3-1-2.1-2.5-2.1-1 0-2 .4-2.7 1.1-.7.7-1 1.6-1 2.7v7.4c0 2.4-1.6 4.3-5.3 4.3V11.6c0-1.3-1-2.1-2.5-2.1-1 0-2 .4-2.7 1.1-.7.7-1 1.6-1 2.7' fill='none' stroke='%23F3F6FB' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='24' r='3.4' fill='%23F3F6FB'/%3E%3C/svg%3E"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <script>
            ;(function () {
                try {
                    var theme = localStorage.getItem('onetype:theme')
                    var dark
                    if (theme === 'dark' || theme === 'light') {
                        dark = theme === 'dark'
                    } else {
                        dark = window.matchMedia('(prefers-color-scheme: dark)').matches
                    }
                    if (dark) document.documentElement.classList.add('dark')
                } catch (e) {}
            })()
        </script>
        <title>OneType — English &amp; Myanmar Typing Tutor</title>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
